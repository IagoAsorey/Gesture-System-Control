[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gesture-system-control"
version = "1.0.0"
description = "Real-time hand gesture control for system volume and display brightness on Linux (Wayland/Omarchy)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10.0",
    "mediapipe>=0.10.35,<1.0.0",
]

[project.scripts]
gesture-control = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["gesture_control"]
only-include = ["gesture_control", "main.py"]
