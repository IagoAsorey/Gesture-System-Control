[project]
name = "gesture-control"
version = "0.1.0"
description = "Cross-platform gesture control for system volume and brightness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "screen-brightness-control>=0.27",
    "pyautogui>=0.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"